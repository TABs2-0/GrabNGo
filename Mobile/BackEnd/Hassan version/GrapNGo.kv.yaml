<First_Page>:
    canvas.before:
        Color:
            rgba: deep_midnight
        Rectangle:
            pos: self.pos
            size: self.size

    BoxLayout:
        orientation: "vertical"
        padding: "24dp"
        spacing: "20dp"

        # ---------- TOP SECTION ----------
        BoxLayout:
            orientation: "vertical"
            size_hint_y: 0.45
            spacing: "12dp"

            Widget:
                size_hint_y: 0.1

            Image:
                source: "logo.png"
                size_hint: None, None
                size: "140dp", "140dp"
                pos_hint: {'center_x': 0.5}

            GrabNGoLabel:
                font_size: "46sp"
                color: [0.85, 0.95, 1, 1]

            Label:
                text: "Connecting you to a global market"
                font_size: "14sp"
                color: [0.7, 0.8, 0.9, 0.6]
                size_hint_y: None
                height: "22dp"

        # ---------- GLASS CARD (MAIN ACTIONS) ----------
        FloatLayout:
            size_hint_y: 0.4

            canvas.before:
                Color:
                    rgba: (0.1, 0.15, 0.25, 0.85)
                RoundedRectangle:
                    pos: self.pos
                    size: self.size
                    radius: [25]

            BoxLayout:
                orientation: "vertical"
                padding: "22dp"
                spacing: "14dp"

                Label:
                    text: "Sign in"
                    font_size: "18sp"
                    color: [0.4, 0.85, 1, 1]
                    size_hint_y: None
                    height: "26dp"

                PrimaryButton:
                    text: "Login as a Buyer"
                    on_press: app.root.current = "buyer_login_page"

                PrimaryButton:
                    text: "Login as a Seller"
                    on_press: app.root.current = "seller_login_page"

                Widget:
                    size_hint_y: 0.1

                Label:
                    text: "or create a new account"
                    font_size: "13sp"
                    color: [1, 1, 1, 0.35]
                    size_hint_y: None
                    height: "20dp"

                BoxLayout:
                    size_hint_y: None
                    height: "48dp"
                    spacing: "12dp"

                    PrimaryButton:
                        text: "Buyer Account"
                        on_press: app.root.current = "create_buyer_account_page"

                    PrimaryButton:
                        text: "Seller Account"
                        on_press: app.root.current = "create_seller_account_page"

        # ---------- FOOTER / DELIVERY ----------
        BoxLayout:
            size_hint_y: 0.15
            padding: "10dp"
            spacing: "10dp"

            Widget:

            PrimaryButton:
                text: "Delivery Agent Access"
                size_hint: None, None
                size: "200dp", "44dp"
                on_press: app.root.current = "delivery_agent_login_page"

            Widget:


<Buyer_Login_Page>:
    canvas.before:
        Color:
            rgba: deep_midnight
        Rectangle:
            pos: self.pos
            size: self.size

    BoxLayout:
        orientation: "vertical"
        padding: "18dp"
        spacing: "10dp"

        # ---------- HEADER ----------
        BoxLayout:
            size_hint_y: None
            height: "56dp"
            spacing: "10dp"

            SecondaryButton:
                text: "<<"
                font_size: "18sp"
                size_hint_x: None
                width: "48dp"
                on_press: app.root.current = "first_page"

            Label:
                text: "Buyer Login"
                font_size: "18sp"
                bold: True
                color: [0.4, 0.85, 1, 1]
                halign: "left"
                valign: "middle"

        # ---------- GLASS LOGIN CARD ----------
        FloatLayout:
            size_hint_y: 1

            canvas.before:
                Color:
                    rgba: (0.1, 0.15, 0.25, 0.9)
                RoundedRectangle:
                    pos: self.pos
                    size: self.size
                    radius: [28]

            BoxLayout:
                orientation: "vertical"
                padding: "26dp"
                spacing: "14dp"

                Label:
                    text: "Welcome Back"
                    font_size: "26sp"
                    bold: True
                    color: [0.9, 0.95, 1, 1]
                    size_hint_y: None
                    height: "48dp"
                    halign: "center"

                Label:
                    text: "Login to continue shopping"
                    font_size: "13sp"
                    color: [1, 1, 1, 0.45]
                    size_hint_y: None
                    height: "22dp"

                Widget:
                    size_hint_y: None
                    height: "8dp"

                # ---------- INPUTS ----------
                CustomInput:
                    id: buyer_login_name
                    hint_text: "Full Name"
                    pos_hint: {'center_x': 0.5}

                CustomInput:
                    id: buyer_login_email
                    hint_text: "Email"
                    pos_hint: {'center_x': 0.5}

                CustomInput:
                    id: buyer_login_password
                    hint_text: "Password"
                    password: True
                    pos_hint: {'center_x': 0.5}

                # ---------- PASSWORD ACTION ----------
                BoxLayout:
                    size_hint_y: None
                    height: "28dp"

                    Button:
                        text: "Forgot Password?"
                        background_color: 0, 0, 0, 0
                        color: [1, 0.4, 0.4, 0.85]
                        bold: True
                        font_size: "14sp"
                        on_press: root.fogot_password()

                    Widget:

                # ---------- FEEDBACK TEXT ----------
                Label:
                    text: root.answer_to_password_forgotten
                    color: [0.3, 1, 0.4, 1]
                    bold: True
                    font_size: "14sp"
                    size_hint_y: None
                    height: "22dp"

                Label:
                    text: root.login_text
                    color: [0.3, 1, 0.4, 1]
                    bold: True
                    font_size: "14sp"
                    size_hint_y: None
                    height: "22dp"

                Widget:
                    size_hint_y: None
                    height: "10dp"

                # ---------- LOGIN BUTTON ----------
                PrimaryButton:
                    text: "Login"
                    on_press: root.Buyer_Loginto_app()

                # ---------- CREATE ACCOUNT ----------
                Button:
                    text: "New user? Create Account"
                    background_color: 0, 0, 0, 0
                    color: [0.6, 0.85, 1, 1]
                    bold: True
                    font_size: "13sp"


