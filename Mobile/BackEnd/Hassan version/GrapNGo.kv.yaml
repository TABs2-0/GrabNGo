# --- THEME DEFINITIONS ---
#:set deep_midnight [0.08, 0.07, 0.15, 1]
#:set soft_lavender [0.7, 0.6, 0.9, 1]
#:set glass_panel [1, 1, 1, 0.05]
#:set white [1, 1, 1, 1]

# THIS LINE FIXES THE "INVALID DATA" ERRORS:
#BuyerDashboard:
#CartPage:
# --- GLOBAL STYLES ---
<GrabNGoLabel@Label>:
    text: "GrabNGo"
    font_size: "45sp"
    bold: True
    color: white
    size_hint_y: None
    height: "60dp"

<HeaderBar@BoxLayout>:
    size_hint_y: None
    height: "50dp"
    padding: ["10dp", "5dp"]
    canvas.before:
        Color:
            rgba: [1, 1, 1, 0.03]
        Rectangle:
            pos: self.pos
            size: self.size
    Label:
        text: "GrabNGo"
        bold: True
        font_size: "35sp"
        color: soft_lavender
        halign: "left"
        text_size: self.size

<CustomInput@TextInput>:
    size_hint_x: 0.75
    size_hint_y: None
    height: "44dp"
    multiline: False
    padding: [15, 10]
    background_normal: ""
    background_active: ""
    background_color: glass_panel
    foreground_color: white
    hint_text_color: [1, 1, 1, 0.3]
    font_size: "14sp"
    cursor_color: soft_lavender
    canvas.after:
        Color:
            rgba: soft_lavender if self.focus else [1, 1, 1, 0.1]
        Line:
            width: 1
            rounded_rectangle: (self.x, self.y, self.width, self.height, 6)

<PrimaryButton@Button>:
    size_hint: 0.4, None
    height: "46dp"
    background_normal: ""
    background_color: 0,0,0,0
    color: white
    bold: True
    pos_hint: {'center_x': 0.5}
    canvas.before:
        Color:
            rgba: [0.35, 0.25, 0.6, 1] if self.state == 'normal' else [0.2, 0.15, 0.4, 1]
        RoundedRectangle:
            pos: self.pos
            size: self.size
            radius: [8,]

<SecondaryButton@Button>:
    size_hint: 0.4, None
    height: "46dp"
    background_normal: ""
    background_color: 0,0,0,0
    color: soft_lavender
    pos_hint: {'center_x': 0.5}
    canvas.before:
        Color:
            rgba: soft_lavender
        Line:
            width: 1.1
            rounded_rectangle: (self.x, self.y, self.width, self.height, 8)

